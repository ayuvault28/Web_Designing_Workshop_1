
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 11: HTML Accessibility</title>
</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>Welcome to My Website</h1>
        <p>This is an accessible webpage.</p>
    </header>

    <hr>

    <!-- Navigation Section -->
    <nav aria-label="Main Navigation">
        <a href="#home">Home</a> |
        <a href="#about">About</a> |
        <a href="#contact">Contact</a>
    </nav>

    <hr>

    <main>

        <!-- Home Section -->
        <section id="home">

            <h2>Home Section</h2>

            <img
                src="https://placehold.co/300x200/png"
                alt="Sample nature image"
                width="300"
                height="200"
            >

        </section>

        <hr>

        <!-- About Section -->
        <section id="about">

            <h2>About Section</h2>

            <p>
                Accessibility makes websites easier
                for everyone to use.
            </p>

        </section>

        <hr>

        <!-- Contact Section -->
        <section id="contact">

            <h2>Contact Form</h2>

            <form>

                <label for="username">Your Name:</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >

                <br><br>

                <label for="email">Your Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <br><br>

                <button type="submit">Submit</button>

            </form>

        </section>

    </main>

    <hr>

    <!-- Footer Section -->
    <footer>
        <p>Copyright 2026 My Website</p>
    </footer>

</body>
</html>
