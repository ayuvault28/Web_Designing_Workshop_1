
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 10: Multimedia Elements</title>
</head>
<body>

    <h1>HTML Multimedia Elements</h1>

    <hr>

    <!-- 1. Image -->
    <h2>1. Image</h2>

    <img
        src="https://picsum.photos/300/200"
        alt="Sample Nature Image"
        width="300"
        height="200"
    >

    <hr>

    <!-- 2. Video -->
    <h2>2. Video</h2>

    <video width="400" controls>
        <source
            src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
            type="video/mp4"
        >
        Your browser does not support video.
    </video>

    <hr>

    <!-- 3. Audio -->
    <h2>3. Audio</h2>

    <audio controls>
        <source
            src="https://www.w3schools.com/html/horse.mp3"
            type="audio/mpeg"
        >
        Your browser does not support audio.
    </audio>

    <hr>

    <!-- 4. YouTube Video -->
    <h2>4. YouTube Video</h2>

    <iframe
        width="400"
        height="250"
        src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ"
        title="YouTube Video"
        allowfullscreen>
    </iframe>

</body>
</html>
